<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="xingyueji-version" content="2.2.0.0">
  <title>注册与账户帮助 - 星月集</title>
  <!-- 仅统一浏览器标签页/添加到主屏幕的站点图标；注册卡片正文不增加头像。 -->
  <link rel="icon" href="/assets/avatar-glass.png?v=312c1e75" type="image/png">
  <link rel="apple-touch-icon" href="/assets/avatar-glass.png?v=312c1e75">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- 从手机主屏幕启动时保持与网站主页一致的独立应用外观。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="星月集">
  <meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111b21" media="(prefers-color-scheme: dark)">
  <script src="/pwa.js"></script>
  <script src="/theme.js"></script>
  <script src="/i18n.js" defer></script>
  <!-- 注册与找回密码卡片使用和主页入口相同的动态背景折射层。 -->
  <script src="/liquid-glass.js"></script>
  <style>
    /* ========================================================
       01. 登录页颜色与基础重置
       --------------------------------------------------------
       本页独立于主页，避免修改登录卡片时意外影响主页布局。
       所有常用颜色集中在 :root，后续可直接搜索变量名修改。
       ======================================================== */
    :root {
      --paper: #faf8f4;
      --paper-deep: #f1ece4;
      --ink: #262626;
      --muted: #75716c;
      --line: #ded8cf;
      --cyan: #28b8cc;
      --cyan-deep: #168da1;
      --cyan-soft: #e6f8fa;
      --white: #fff;
      --danger: #b94a48;
      --success: #357b61;
      --shadow: 0 26px 80px rgba(49, 45, 39, .13);
      --font-ui: ui-rounded, "SF Pro Rounded", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      --font-display: "Yuanti SC", "YouYuan", ui-rounded, "Arial Rounded MT Bold", "SF Pro Rounded", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      --font-hei: "Heiti SC", "SimHei", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-ui);
      font-weight: 520;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    /* ========================================================
       02. 单栏居中结构
       --------------------------------------------------------
       注册和找回密码都在页面正中显示，不再设置左侧品牌。
       网站登录统一由根页面 / 的全屏入口负责，本页不再保留第二套登录框。
       背景只轮播个人空间中的公开照片，“返回网站首页”固定在左下角。
       ======================================================== */
    .auth-page {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 64px) clamp(13px, 4vw, 44px) 88px;
    }

    /* 电脑和手机统一使用无模糊 cover 主图，避免旧版手机双层背景产生雾感。 */
    .auth-photo-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #edf3f5;
    }
    .auth-photo-background::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: transparent;
    }
    .auth-photo-frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.15s ease;
    }
    .auth-photo-frame img {
      position: absolute;
      display: block;
      user-select: none;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .auth-photo-frame .photo-complete {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: none;
    }
    .auth-photo-frame.active { opacity: 1; animation: auth-bg-fade 1.25s ease both; }
    .auth-photo-frame.active.effect-wipe-left { animation-name: auth-bg-wipe-left; }
    .auth-photo-frame.active.effect-wipe-right { animation-name: auth-bg-wipe-right; }
    .auth-photo-frame.active.effect-reveal-center { animation-name: auth-bg-reveal-center; }
    @keyframes auth-bg-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes auth-bg-wipe-left { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
    @keyframes auth-bg-wipe-right { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
    @keyframes auth-bg-reveal-center { from { clip-path: inset(0 50%); } to { clip-path: inset(0); } }
    @media (prefers-reduced-motion: reduce) {
      .auth-photo-frame { transition: opacity .25s ease; animation: none !important; }
    }

    /* 左下角入口使用有色毛玻璃；蓝灰底色保证它在浅色照片上仍有层次。 */
    .home-link {
      position: fixed;
      z-index: 5;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 14px;
      color: #17343d;
      background: rgba(104,158,194,.32);
      font-size: .84rem;
      font-family: var(--font-hei);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(20,43,50,.17), inset 0 1px 0 rgba(255,255,255,.90);
      -webkit-backdrop-filter: blur(15px) saturate(1.14);
      backdrop-filter: blur(15px) saturate(1.14);
      transition: color .18s, border-color .18s, transform .18s;
    }
    .home-link:hover { color: var(--ink); border-color: #bcb4a9; transform: translateX(-2px); }

    .card-side {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      /*
         独立登录/注册框由 610px 加宽到 720px，并把桌面端上下留白压缩到
         30px。左右仍保留较宽空间，使表单显得舒展但整体高度更低。
      */
      width: min(100%, 720px);
      padding: 30px clamp(34px, 5vw, 52px);
      position: relative; isolation: isolate; overflow: hidden;
      border: 0;
      border-radius: 30px;
      /*
         中心轻微磨砂并向四周渐变为透明玻璃。边缘的放大和模糊来自同步
         背景副本，不再依赖一条静态白边，因此照片移动时折射也会随之变化。
      */
      background:
        radial-gradient(ellipse 88% 82% at 50% 47%, rgba(247,252,252,.22) 0%, rgba(239,249,250,.13) 44%, rgba(223,244,247,.045) 72%, transparent 100%);
      box-shadow:
        0 32px 90px rgba(14,35,42,.28),
        inset 0 0 36px rgba(255,255,255,.08),
        inset 0 -12px 30px rgba(56,105,119,.055);
      -webkit-backdrop-filter: blur(3.5px) saturate(1.10) contrast(1.025);
      backdrop-filter: blur(3.5px) saturate(1.10) contrast(1.025);
      /* 取消整张卡片继承的白色字晕，浅色照片前文字边缘会更清晰。 */
      text-shadow: none;
    }
    .auth-card::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse 76% 72% at 50% 46%, rgba(255,255,255,.16), rgba(255,255,255,.07) 46%, transparent 86%);
      -webkit-backdrop-filter: blur(7px) saturate(1.08);
      backdrop-filter: blur(7px) saturate(1.08);
      -webkit-mask-image: radial-gradient(ellipse 84% 80% at 50% 48%, #000 0 43%, rgba(0,0,0,.72) 61%, rgba(0,0,0,.16) 82%, transparent 100%);
      mask-image: radial-gradient(ellipse 84% 80% at 50% 48%, #000 0 43%, rgba(0,0,0,.72) 61%, rgba(0,0,0,.16) 82%, transparent 100%);
    }
    .auth-card > * { position: relative; z-index: 2; }
    .auth-card > .liquid-glass-refraction { position: absolute; z-index: 0; }
    .card-head { margin-bottom: 20px; text-align: center; }
    /* 中文标题已经足够明确，不再额外显示 ACCOUNT LOGIN 等英文装饰行。 */
    .eyebrow { display: none; }
    .card-head h2 { margin: 0 0 7px; font-family: var(--font-display); font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 860; letter-spacing: -.025em; }
    .card-head p { margin: 0; color: var(--muted); line-height: 1.55; }

    /* ========================================================
       03. 表单、按钮与状态提示
       ======================================================== */
    .panel[hidden] { display: none !important; }
    .panel:not([hidden]) { animation: auth-panel-arrive .34s cubic-bezier(.18,.78,.2,1) both; }
    @keyframes auth-panel-arrive {
      0% { opacity: 0; transform: translateY(13px) scale(.985); filter: blur(7px); }
      62% { opacity: .94; transform: translateY(-1px) scale(1.006); filter: blur(1px); }
      100% { opacity: 1; transform: none; filter: none; }
    }
    .field { display: grid; gap: 6px; margin-bottom: 13px; }
    .field label { font-size: .84rem; font-weight: 800; }
    .field small { color: var(--muted); line-height: 1.55; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 14px;
      padding: 11px 14px;
      color: var(--ink);
      background: rgba(255,255,255,.075);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.91), inset 0 -1px 0 rgba(44,85,99,.12), 0 7px 18px rgba(31,62,72,.07);
      -webkit-backdrop-filter: blur(2px) saturate(1.08); backdrop-filter: blur(2px) saturate(1.08);
      text-shadow: none;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .field textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(40,184,204,.12);
    }
    .two-fields { display: grid; grid-template-columns: 1fr 1.35fr; gap: 12px; }
    .check-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: -1px 0 15px; }
    .remember { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .88rem; }
    .remember input { accent-color: var(--cyan-deep); }
    .text-button {
      padding: 0; border: 0; background: none; color: var(--cyan-deep);
      cursor: pointer; font-weight: 700; text-decoration: none;
    }
    .text-button:hover { text-decoration: underline; }
    .btn {
      min-height: 46px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; border: 1px solid rgba(255,255,255,.72); border-radius: 14px;
      padding: 11px 17px; cursor: pointer; color: #12343c;
      /* 单一蓝青色半透明底，不使用明显渐变，也不会退成与背景相融的白色。 */
      background: rgba(43,166,185,.56);
      box-shadow: 0 12px 28px rgba(16,105,122,.23), inset 0 1px 0 rgba(255,255,255,.91), inset 0 -1px 0 rgba(11,83,97,.22);
      -webkit-backdrop-filter: blur(15px) saturate(1.16); backdrop-filter: blur(15px) saturate(1.16);
      font-family: var(--font-hei); font-weight: 800; text-decoration: none;
      text-shadow: none;
      transition: transform .10s, background-color .10s, box-shadow .10s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.04); box-shadow: 0 16px 34px rgba(16,105,122,.29), inset 0 1px 0 #fff; }
    .btn:disabled { opacity: .55; cursor: wait; transform: none; }
    .btn.ghost {
      color: #17343d; border-color: rgba(255,255,255,.78); background: rgba(104,158,194,.32);
      box-shadow: 0 9px 22px rgba(31,62,72,.10), inset 0 1px 0 rgba(255,255,255,.92);
      text-shadow: none;
    }
    .btn.ghost:hover { border-color: rgba(255,255,255,.96); background: rgba(88,158,190,.43); }
    .btn.block { width: 100%; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .button-row .btn { flex: 1 1 130px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: #aaa39b; font-size: .78rem; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .notice { min-height: 24px; margin: 15px 0 0; color: var(--muted); line-height: 1.55; font-size: .88rem; }
    .notice.error { color: var(--danger); }
    .notice.success { color: var(--success); }
    .privacy-note {
      margin: 3px 0 20px; padding: 13px 15px; border-left: 3px solid var(--cyan);
      border-radius: 4px 12px 12px 4px; background: rgba(230,248,250,.075);
      color: #4b6468; line-height: 1.7; font-size: .86rem;
      -webkit-backdrop-filter: blur(2px) saturate(1.08); backdrop-filter: blur(2px) saturate(1.08);
    }

    /* 注册进度条只表示页面位置，不代表账户已经审核通过。 */
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 20px; }
    .step { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; color: #aaa39b; font-size: .76rem; }
    .step::after { content: ""; grid-column: 1 / -1; height: 3px; border-radius: 9px; background: var(--line); }
    .step-number {
      width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.72); background: rgba(255,255,255,.065); font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.90); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    }
    .step.active { color: var(--cyan-deep); }
    .step.active::after, .step.done::after { background: var(--cyan); }
    .step.active .step-number, .step.done .step-number {
      color: #15343c; background: rgba(40,184,204,.44);
      text-shadow: none;
    }
    .register-step[hidden] { display: none; }
    .summary-list { margin: 0 0 22px; border: 1px solid rgba(255,255,255,.72); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.055); }
    .summary-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .summary-row:last-child { border-bottom: 0; }
    .summary-row dt { color: var(--muted); }
    .summary-row dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; white-space: pre-wrap; }
    .status-badge { display: inline-flex; padding: 5px 10px; border-radius: 99px; background: #fff1ce; color: #7b5c18; font-size: .78rem; font-weight: 900; }
    .status-badge.approved { background: #e4f5ed; color: #2e7158; }
    .status-badge.rejected, .status-badge.disabled { background: #fde9e8; color: #984341; }
    .success-box { padding: 22px; border: 1px solid rgba(215,255,237,.72); border-radius: 16px; background: rgba(240,250,245,.065); line-height: 1.8; backdrop-filter: blur(2px); }

    /* 登录与注册页与主页共用“快速按下、较柔和的单次回弹”节奏。 */
    :is(button, a.btn, .home-link) { transform-origin: center; will-change: transform; }
    :is(button, a.btn, .home-link).control-bounce-release { animation: auth-control-single-rebound .30s cubic-bezier(.16,.78,.22,1) both !important; }
    @keyframes auth-control-single-rebound {
      0% { transform: translateZ(0) scale(1); }
      16% { transform: translate3d(0,1px,0) scale(.965); }
      58% { transform: translate3d(0,-3px,0) scale(1.045); }
      100% { transform: none; }
    }
    /* 松手后短暂加深按钮颜色，随后恢复；步骤指示器会持续保留 active 颜色。 */
    :is(button, a.btn, .home-link).control-bounce-release:not(.active) {
      background-color: rgba(38,157,178,.62) !important;
      border-color: rgba(30,135,158,.62) !important;
    }

    /*
       白光在按下时立刻出现，而不是等松手；范围较小，不会遮住相邻表单。
    */
    .harmony-light-bloom {
      --bloom-size: 72px;
      position: fixed; z-index: 2147483646; left: 0; top: 0;
      width: var(--bloom-size); height: var(--bloom-size);
      border-radius: 46% 54% 58% 42% / 52% 42% 58% 48%;
      pointer-events: none; opacity: .68;
      transform: translate(-50%, -50%) scale(.82);
      background:
        radial-gradient(ellipse at 42% 48%, rgba(255,255,255,.92) 0 7%, rgba(255,255,255,.43) 24%, rgba(255,255,255,.11) 48%, transparent 72%),
        radial-gradient(ellipse at 66% 35%, rgba(255,255,255,.54), transparent 52%),
        radial-gradient(ellipse at 29% 70%, rgba(229,251,255,.44), transparent 54%);
      filter: blur(1.8px); mix-blend-mode: screen;
      animation: auth-light-hold-in .11s cubic-bezier(.18,.72,.2,1) both;
    }
    .harmony-light-bloom.is-releasing { animation: auth-light-diffuse .30s cubic-bezier(.12,.68,.18,1) both; }
    .harmony-light-bloom::before,
    .harmony-light-bloom::after {
      content: ""; position: absolute; pointer-events: none; border-radius: inherit;
      background: radial-gradient(ellipse, rgba(255,255,255,.52), transparent 68%);
    }
    .harmony-light-bloom::before { inset: 18% -13% 4% 31%; transform: rotate(23deg); }
    .harmony-light-bloom::after { inset: 35% 29% -12% -9%; transform: rotate(-31deg); }
    @keyframes auth-light-hold-in {
      from { opacity: .24; transform: translate(-50%, -50%) scale(.20) rotate(-4deg); }
      to { opacity: .68; transform: translate(-50%, -50%) scale(.82) rotate(0); }
    }
    @keyframes auth-light-diffuse {
      0% { opacity: .68; transform: translate(-50%, -50%) scale(.82) rotate(0); }
      52% { opacity: .34; transform: translate(-50%, -50%) scale(1.03) rotate(4deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.38, 1.28) rotate(7deg); filter: blur(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel:not([hidden]), :is(button, a.btn, .home-link).control-bounce-release { animation: none !important; }
      .harmony-light-bloom { display: none !important; }
    }

    @media (max-width: 850px) {
      /* 主题按钮占用右上角；表单从其下方开始，并允许整页自然向下滚动。 */
      .auth-page {
        align-items: flex-start;
        padding-top: max(76px, calc(env(safe-area-inset-top) + 62px));
      }
      .card-side { align-items: flex-start; }
      .auth-card { position: relative; z-index: 2; border-radius: 19px; }
    }
    @media (max-height: 700px) {
      /* 横屏手机和矮窗口不再强制垂直居中，避免登录框上半部分滚不到。 */
      .auth-page {
        align-items: flex-start;
        padding-top: max(76px, calc(env(safe-area-inset-top) + 62px));
      }
      .card-side { align-items: flex-start; }
    }
    @media (max-width: 540px) {
      /* 手机端保持单列和足够大的触控区域，不套用桌面端横向压缩方式。 */
      .auth-card { padding: 25px 18px; }
      .two-fields { grid-template-columns: 1fr; gap: 0; }
      .step { grid-template-columns: 27px 1fr; font-size: .69rem; }
      .step-number { width: 27px; height: 27px; }
      .summary-row { grid-template-columns: 90px 1fr; }
      .check-row { align-items: flex-start; }
    }
  </style>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/vnext.css">
  <link rel="stylesheet" href="/material.css">
</head>
<body>
  <!-- 仅由公开图片专栏生成；不会把会员照片放到未登录页面。 -->
  <div id="auth-photo-background" class="auth-photo-background" aria-hidden="true"></div>
  <!-- 注册、找回密码与重置密码页面共用右上角夜览开关。 -->
  <div class="night-mode-control floating-night-mode-control" data-theme-switch>
    <span id="auth-night-mode-label" class="night-mode-label">夜览模式</span>
    <button class="night-mode-switch" type="button" role="switch" aria-checked="false" aria-labelledby="auth-night-mode-label" data-theme-switch-button>
      <span class="night-mode-fill" aria-hidden="true"></span>
      <span class="night-mode-knob" aria-hidden="true"></span>
    </button>
  </div>
  <main class="auth-page">
    <!-- 页面左下角只保留返回入口，登录与注册表单自身位于屏幕正中。 -->
    <a class="home-link" href="/">← 返回网站首页</a>
    <section class="card-side">
      <div class="auth-card">
        <!-- 三步注册面板 -->
        <section id="panel-register" class="panel" hidden>
          <header class="card-head"><p class="eyebrow">CREATE ACCOUNT</p><h2>申请注册</h2></header>
          <div class="steps" aria-label="注册进度">
            <div class="step active" data-step-indicator="1"><span class="step-number">1</span><span>创建账号</span></div>
            <div class="step" data-step-indicator="2"><span class="step-number">2</span><span>验证信息</span></div>
            <div class="step" data-step-indicator="3"><span class="step-number">3</span><span>确认提交</span></div>
          </div>
          <form id="register-form">
            <!-- 第一步没有用户协议或隐私勾选项。 -->
            <div class="register-step" data-register-step="1">
              <div class="field"><label for="register-username">登录用户名</label><input id="register-username" required minlength="4" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{3,31}" autocomplete="username" placeholder="4—32位字母、数字或 _ . -"></div>
              <div class="field"><label for="register-nickname">昵称</label><input id="register-nickname" required maxlength="30" autocomplete="nickname" placeholder="在网站中显示的名称"></div>
              <div class="field"><label for="register-password">设置密码</label><input id="register-password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="至少8位，包含字母和数字"></div>
              <div class="field"><label for="register-password-confirm">确认密码</label><input id="register-password-confirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="再次输入密码"></div>
              <div class="button-row"><a class="btn ghost" href="/?login=1" data-canonical-login>返回登录</a><button class="btn" type="button" data-register-next>下一步</button></div>
            </div>

            <div class="register-step" data-register-step="2" hidden>
              <div class="field"><label for="register-display-name">真实姓名或常用昵称（写社交平台昵称亦可）</label><input id="register-display-name" required maxlength="60" placeholder="便于站长确认你的身份"></div>
              <div class="two-fields">
                <div class="field"><label for="register-contact-type">联系方式类型（选填）</label><select id="register-contact-type"><option value="other">不填写</option><option value="qq">QQ</option><option value="wechat">微信</option><option value="email">邮箱</option><option value="phone">手机号</option></select></div>
                <div class="field"><label for="register-contact">联系方式（选填）</label><input id="register-contact" maxlength="160" placeholder="可以留空"></div>
              </div>
              <div class="field"><label for="register-note">备注（选填）</label><textarea id="register-note" maxlength="800" placeholder="主要面向与站长不认识的申请人，可简单说明身份、认识途径或注册原因"></textarea></div>
              <div class="field"><label for="register-invite">邀请码（选填）</label><input id="register-invite" maxlength="80" placeholder="没有邀请码可以留空"></div>
              <div class="button-row"><button class="btn ghost" type="button" data-register-back>上一步</button><button class="btn" type="button" data-register-next>下一步</button></div>
            </div>

            <div class="register-step" data-register-step="3" hidden>
              <dl id="register-summary" class="summary-list"></dl>
              <div class="button-row"><button class="btn ghost" type="button" data-register-back>上一步</button><button id="register-submit" class="btn" type="submit">提交注册申请</button></div>
              <p id="register-notice" class="notice" aria-live="polite"></p>
            </div>
          </form>
        </section>

        <!-- 忘记密码：提交后由站长通过预留联系方式核实。 -->
        <section id="panel-forgot" class="panel" hidden>
          <header class="card-head"><p class="eyebrow">PASSWORD HELP</p><h2>申请重置密码</h2></header>
          <form id="forgot-form">
            <div class="field"><label for="forgot-username">登录用户名</label><input id="forgot-username" required maxlength="32" autocomplete="username"></div>
            <div class="two-fields">
              <div class="field"><label for="forgot-contact-type">联系方式类型</label><select id="forgot-contact-type"><option value="qq">QQ</option><option value="wechat">微信</option><option value="email">邮箱</option><option value="phone">手机号</option><option value="other">其他</option></select></div>
              <div class="field"><label for="forgot-contact">注册时的联系方式</label><input id="forgot-contact" required maxlength="160"></div>
            </div>
            <button class="btn block" type="submit">提交重置申请</button>
            <p id="forgot-notice" class="notice" aria-live="polite"></p>
          </form>
          <div class="divider">返回</div>
          <a class="btn ghost block" href="/?login=1" data-canonical-login>返回登录</a>
        </section>

        <!-- 一次性重置链接会直接打开此面板，链接有效期为24小时。 -->
        <section id="panel-reset" class="panel" hidden>
          <header class="card-head"><p class="eyebrow">NEW PASSWORD</p><h2>设置新密码</h2><p id="reset-description">正在验证一次性重置链接…</p></header>
          <form id="reset-form" hidden>
            <div class="field"><label for="reset-password">新密码</label><input id="reset-password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="至少8位，包含字母和数字"></div>
            <div class="field"><label for="reset-password-confirm">确认新密码</label><input id="reset-password-confirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></div>
            <button class="btn block" type="submit">确认重置密码</button>
            <p id="reset-notice" class="notice" aria-live="polite"></p>
          </form>
          <a id="reset-back" class="btn ghost block" href="/?login=1" data-canonical-login hidden>返回登录</a>
        </section>

        <!-- 浏览器已有有效账号会话时显示，避免重复登录。 -->
        <section id="panel-signed" class="panel" hidden>
          <header class="card-head"><p class="eyebrow">ACCOUNT STATUS</p><h2>你已经登录</h2></header>
          <div class="success-box">
            <strong id="signed-nickname"></strong>
            <p>登录用户名：<span id="signed-username"></span></p>
            <p>账户状态：<span id="signed-status" class="status-badge"></span></p>
          </div>
          <div class="button-row" style="margin-top:20px"><a id="signed-enter" class="btn" href="/">进入网站</a><button id="signed-logout" class="btn ghost" type="button">退出账号</button></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    /* ========================================================
       注册与账户帮助页 JavaScript
       负责切换面板、三步注册、找回密码和一次性密码重置。
       登录与游客入口只存在于网站根页面，避免维护两套外观不同的登录框。
       ======================================================== */
    const params = new URLSearchParams(location.search);
    const resetToken = params.get("reset") || "";
    const requestedMode = params.get("mode") || "login";
    const requestedNext = params.get("next") || "/";

    /* 只允许跳转到本站内部路径，阻止 next 参数把用户带到外部网站。 */
    const nextPath = requestedNext.startsWith("/") && !requestedNext.startsWith("//") ? requestedNext : "/";
    const nextHash = new URL(nextPath, location.origin).hash;
    const canonicalLoginPath = `/?login=1${nextHash}`;
    let registerStep = 1;

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const type = response.headers.get("content-type") || "";
      const data = type.includes("application/json") ? await response.json() : null;
      if (!response.ok) throw new Error(data?.error || `请求失败（${response.status}）`);
      return data;
    }

    /*
     * 专用入口接口已经在 Worker 端完成“大板块公开 + 照片公开”双重筛选，
     * 并且不要求游客会话。旧代码请求 /api/bootstrap，会在尚未登录/验证时
     * 得到 401，注册页因而只能显示黑色备用背景。
     */
    function publicPhotoUrls(data) {
      return [...new Set((data?.photos || []).map((photo) => photo.url).filter(Boolean))];
    }

    /*
     * 两个 frame 循环复用，避免一次加载所有公开照片。电脑和手机都使用清晰
     * cover 主图；卡片折射层复用同一压缩预览，浏览器会命中自身缓存。
     */
    function startPhotoBackground(urls) {
      const host = document.getElementById("auth-photo-background");
      if (!host || !urls.length) return;
      const createFrame = () => {
        const root = document.createElement("div");
        root.className = "auth-photo-frame";
        const complete = document.createElement("img");
        complete.className = "photo-complete";
        complete.alt = "";
        complete.decoding = "async";
        root.append(complete); host.append(root);
        return { root, complete };
      };
      const frames = [createFrame(), createFrame()];
      const glassLens = globalThis.XingyuejiLiquidGlass?.createPhotoLens([
        document.querySelector(".auth-card"),
      ]);
      const setFrameSource = (frame, url, ready) => {
        const absoluteUrl = new URL(url, location.href).href;
        if (frame.complete.src === absoluteUrl && frame.complete.complete) {
          queueMicrotask(ready);
          return;
        }
        frame.complete.onload = ready;
        frame.complete.src = url;
      };
      let activeFrame = 0;
      let photoIndex = 0;
      const effects = ["effect-fade", "effect-wipe-left", "effect-wipe-right", "effect-reveal-center"];
      let effectIndex = 0;
      frames[0].root.classList.add(effects[effectIndex]);
      setFrameSource(frames[0], urls[0], () => {
        frames[0].root.classList.add("active");
        glassLens?.setSource(urls[0]);
      });

      if (urls.length === 1 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      window.setInterval(() => {
        const nextFrame = activeFrame === 0 ? 1 : 0;
        photoIndex = (photoIndex + 1) % urls.length;
        const incoming = frames[nextFrame];
        const outgoing = frames[activeFrame];
        setFrameSource(incoming, urls[photoIndex], () => {
          effectIndex = (effectIndex + 1) % effects.length;
          incoming.root.classList.remove("active", ...effects);
          incoming.root.classList.add(effects[effectIndex], "active");
          outgoing.root.classList.remove("active");
          glassLens?.setSource(urls[photoIndex]);
          activeFrame = nextFrame;
        });
      }, 7_000);
    }

    async function initializePhotoBackground() {
      try { startPhotoBackground(publicPhotoUrls(await api("/api/guest/entry-background"))); }
      catch { /* 数据服务失败时保留纯色背景，不影响登录和注册表单。 */ }
    }

    function setNotice(node, message, kind = "") {
      node.textContent = message;
      node.className = `notice${kind ? ` ${kind}` : ""}`;
    }

    function showPanel(name) {
      document.querySelectorAll(".panel").forEach((panel) => { panel.hidden = panel.id !== `panel-${name}`; });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* 按下即创建柔光；按住期间停留，松手或取消后才开始消散。 */
    function emitHarmonyLightBloom(control, point = null) {
      if (!control || matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
      const rect = control.getBoundingClientRect();
      const hasPointerPoint = Number.isFinite(point?.x) && Number.isFinite(point?.y);
      const x = hasPointerPoint ? point.x : rect.left + rect.width / 2;
      const y = hasPointerPoint ? point.y : rect.top + rect.height / 2;
      const bloomSize = Math.min(118, Math.max(48, Math.max(rect.width, rect.height) * .82));
      const bloom = document.createElement("span");
      bloom.className = "harmony-light-bloom";
      bloom.style.left = `${x}px`;
      bloom.style.top = `${y}px`;
      bloom.style.setProperty("--bloom-size", `${bloomSize}px`);
      bloom.setAttribute("aria-hidden", "true");
      document.body.append(bloom);
      return bloom;
    }

    function releaseHarmonyLightBloom(bloom) {
      if (!bloom?.isConnected || bloom.classList.contains("is-releasing")) return;
      bloom.classList.add("is-releasing");
      bloom.addEventListener("animationend", () => bloom.remove(), { once: true });
      window.setTimeout(() => bloom.remove(), 560);
    }

    /* 所有静态和后续动态生成的按钮统一播放单次回弹与白光扩散。 */
    function installLiquidGlassControlMotion() {
      const selector = "button, a.btn, .home-link";
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let pressedControl = null;
      let pressedPoint = null;
      let pressedBloom = null;
      const reboundTimers = new WeakMap();
      const findControl = (target) => target instanceof Element ? target.closest(selector) : null;
      const canAnimate = (control) => control && !control.matches(":disabled");
      const playBounce = (control) => {
        if (reducedMotion.matches || !canAnimate(control)) return;
        const previousTimer = reboundTimers.get(control);
        if (previousTimer) window.clearTimeout(previousTimer);
        control.classList.remove("control-bounce-release");
        void control.offsetWidth;
        control.classList.add("control-bounce-release");
        const timer = window.setTimeout(() => {
          control.classList.remove("control-bounce-release");
          reboundTimers.delete(control);
        }, 680);
        reboundTimers.set(control, timer);
      };
      const beginPress = (control) => {
        const previousTimer = reboundTimers.get(control);
        if (previousTimer) window.clearTimeout(previousTimer);
        reboundTimers.delete(control);
        control.classList.remove("control-bounce-release");
        control.classList.add("is-control-pressed");
      };
      const release = (control) => {
        if (control) {
          control.classList.remove("is-control-pressed");
          playBounce(control);
        }
        releaseHarmonyLightBloom(pressedBloom);
        pressedBloom = null;
      };
      document.addEventListener("pointerdown", (event) => {
        const control = findControl(event.target);
        if (!canAnimate(control)) return;
        pressedControl = control;
        pressedPoint = { x: event.clientX, y: event.clientY };
        beginPress(control);
        releaseHarmonyLightBloom(pressedBloom);
        pressedBloom = emitHarmonyLightBloom(control, pressedPoint);
      });
      window.addEventListener("pointerup", (event) => {
        const point = Number.isFinite(event.clientX) ? { x: event.clientX, y: event.clientY } : pressedPoint;
        release(pressedControl, point);
        pressedControl = null;
        pressedPoint = null;
      });
      window.addEventListener("pointercancel", () => {
        pressedControl?.classList.remove("is-control-pressed");
        releaseHarmonyLightBloom(pressedBloom);
        pressedControl = null;
        pressedPoint = null;
        pressedBloom = null;
      });
      document.addEventListener("keydown", (event) => {
        if (!['Enter', ' '].includes(event.key) || event.repeat) return;
        const control = findControl(event.target);
        if (canAnimate(control)) {
          pressedControl = control;
          beginPress(control);
          releaseHarmonyLightBloom(pressedBloom);
          pressedBloom = emitHarmonyLightBloom(control);
        }
      });
      document.addEventListener("keyup", (event) => {
        if (!['Enter', ' '].includes(event.key)) return;
        release(pressedControl || findControl(event.target));
        pressedControl = null;
        pressedPoint = null;
      });
      window.addEventListener("blur", () => {
        pressedControl?.classList.remove("is-control-pressed");
        releaseHarmonyLightBloom(pressedBloom);
        pressedControl = null;
        pressedPoint = null;
        pressedBloom = null;
      });
    }

    installLiquidGlassControlMotion();

    /* “返回登录”统一回到根页面，并保留用户最初想访问的板块 hash。 */
    document.querySelectorAll("[data-canonical-login]").forEach((link) => {
      link.href = canonicalLoginPath;
    });

    /* ---------- 三步注册 ---------- */
    function updateRegisterStep(nextStep) {
      registerStep = Math.min(3, Math.max(1, nextStep));
      document.querySelectorAll("[data-register-step]").forEach((node) => {
        node.hidden = Number(node.dataset.registerStep) !== registerStep;
      });
      document.querySelectorAll("[data-step-indicator]").forEach((node) => {
        const step = Number(node.dataset.stepIndicator);
        node.classList.toggle("active", step === registerStep);
        node.classList.toggle("done", step < registerStep);
      });
      if (registerStep === 3) renderRegisterSummary();
    }

    function validateRegisterStep() {
      const ids = registerStep === 1
        ? ["register-username", "register-nickname", "register-password", "register-password-confirm"]
        : ["register-display-name"];
      for (const id of ids) {
        const input = document.getElementById(id);
        if (!input.reportValidity()) return false;
      }
      if (registerStep === 1) {
        const password = document.getElementById("register-password").value;
        if (!/\p{L}/u.test(password) || !/\p{N}/u.test(password)) {
          alert("密码至少需要包含一个字母和一个数字。"); return false;
        }
        if (password !== document.getElementById("register-password-confirm").value) {
          alert("两次输入的密码不一致。"); return false;
        }
      }
      return true;
    }

    function renderRegisterSummary() {
      const labels = { qq: "QQ", wechat: "微信", email: "邮箱", phone: "手机号", other: "其他" };
      const values = [
        ["登录用户名", document.getElementById("register-username").value],
        ["昵称", document.getElementById("register-nickname").value],
        ["姓名或称呼", document.getElementById("register-display-name").value],
        ["联系方式", document.getElementById("register-contact").value
          ? `${labels[document.getElementById("register-contact-type").value]} · ${document.getElementById("register-contact").value}`
          : "未填写"],
        ["备注", document.getElementById("register-note").value || "未填写"],
        ["邀请码", document.getElementById("register-invite").value || "未填写"],
      ];
      const summary = document.getElementById("register-summary"); summary.replaceChildren();
      values.forEach(([label, value]) => {
        const row = document.createElement("div"); row.className = "summary-row";
        const term = document.createElement("dt"); term.textContent = label;
        const detail = document.createElement("dd"); detail.textContent = value;
        row.append(term, detail); summary.append(row);
      });
    }

    document.querySelectorAll("[data-register-next]").forEach((button) => button.addEventListener("click", () => {
      if (validateRegisterStep()) updateRegisterStep(registerStep + 1);
    }));
    document.querySelectorAll("[data-register-back]").forEach((button) => button.addEventListener("click", () => updateRegisterStep(registerStep - 1)));

    document.getElementById("register-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = document.getElementById("register-submit");
      const notice = document.getElementById("register-notice");
      submit.disabled = true; setNotice(notice, "正在提交注册申请…");
      try {
        await api("/api/auth/register", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("register-username").value,
            nickname: document.getElementById("register-nickname").value,
            password: document.getElementById("register-password").value,
            displayName: document.getElementById("register-display-name").value,
            contactType: document.getElementById("register-contact-type").value,
            contact: document.getElementById("register-contact").value,
            note: document.getElementById("register-note").value,
            inviteCode: document.getElementById("register-invite").value,
          }),
        });
        localStorage.removeItem("xyj_entry_mode");
        document.getElementById("panel-register").innerHTML = `
          <header class="card-head"><p class="eyebrow">APPLICATION SENT</p><h2>申请已提交</h2></header>
          <div class="success-box"><strong>账号目前处于待审核状态。</strong><p>QQ机器人已经尝试通知站长。审核期间你仍然可以浏览公开内容；审核通过后即可使用AI助手并查看个人空间完整内容。</p></div>
          <a class="btn block" style="margin-top:20px" href="/">进入网站</a>`;
      } catch (error) {
        setNotice(notice, error.message, "error");
      } finally { submit.disabled = false; }
    });

    /* ---------- 忘记密码与一次性重置链接 ---------- */
    document.getElementById("forgot-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = event.currentTarget.querySelector("button[type='submit']");
      const notice = document.getElementById("forgot-notice");
      submit.disabled = true; setNotice(notice, "正在提交…");
      try {
        const result = await api("/api/auth/forgot-password", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("forgot-username").value,
            contactType: document.getElementById("forgot-contact-type").value,
            contact: document.getElementById("forgot-contact").value,
          }),
        });
        setNotice(notice, result.message, "success");
        event.currentTarget.reset();
      } catch (error) { setNotice(notice, error.message, "error"); }
      finally { submit.disabled = false; }
    });

    async function prepareResetPanel() {
      showPanel("reset");
      const description = document.getElementById("reset-description");
      const form = document.getElementById("reset-form");
      const back = document.getElementById("reset-back");
      try {
        const info = await api(`/api/auth/password-reset-info?token=${encodeURIComponent(resetToken)}`);
        if (!info.valid) throw new Error("链接无效、已使用或已过期，请重新申请密码重置。");
        description.textContent = `正在为“${info.nickname}”重置密码。本链接将在24小时内失效，且只能使用一次。`;
        form.hidden = false;
      } catch (error) {
        description.textContent = error.message; back.hidden = false;
      }
    }

    document.getElementById("reset-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("reset-password").value;
      const confirmPassword = document.getElementById("reset-password-confirm").value;
      const notice = document.getElementById("reset-notice");
      if (password !== confirmPassword) { setNotice(notice, "两次输入的密码不一致。", "error"); return; }
      if (!/\p{L}/u.test(password) || !/\p{N}/u.test(password)) { setNotice(notice, "新密码至少需要包含一个字母和一个数字。", "error"); return; }
      const submit = event.currentTarget.querySelector("button[type='submit']");
      submit.disabled = true; setNotice(notice, "正在重置密码…");
      try {
        const result = await api("/api/auth/reset-password", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: resetToken, newPassword: password }),
        });
        setNotice(notice, result.message, "success");
        submit.hidden = true; document.getElementById("reset-back").hidden = false;
      } catch (error) { setNotice(notice, error.message, "error"); submit.disabled = false; }
    });

    /* ---------- 已登录状态 ---------- */
    const statusLabels = { pending: "等待审核", approved: "已通过审核", rejected: "审核未通过", disabled: "账号已停用" };
    async function initialize() {
      if (resetToken) { await prepareResetPanel(); return; }
      /*
       * 旧书签或旧页面仍可能访问 /login?mode=login。统一跳回根页面后，
       * 浏览器只会显示 index.html 中那一套全屏登录框。
       */
      if (!["register", "forgot"].includes(requestedMode)) {
        location.replace(canonicalLoginPath);
        return;
      }
      try {
        const session = await api("/api/auth/session");
        if (session.authenticated) {
          document.getElementById("signed-nickname").textContent = session.user.nickname;
          document.getElementById("signed-username").textContent = session.user.username;
          const status = document.getElementById("signed-status");
          status.textContent = statusLabels[session.user.status] || session.user.status;
          status.className = `status-badge ${session.user.status}`;
          document.getElementById("signed-enter").href = nextPath;
          showPanel("signed"); return;
        }
      } catch { /* 会话检查失败时仍允许显示普通登录表单。 */ }
      showPanel(requestedMode);
    }

    document.getElementById("signed-logout").addEventListener("click", async () => {
      await api("/api/auth/logout", { method: "POST" }).catch(() => null);
      localStorage.removeItem("xyj_entry_mode");
      sessionStorage.removeItem("xyj_guest_handoff");
      location.replace("/");
    });

    updateRegisterStep(1);
    initializePhotoBackground();
    initialize();
  </script>
</body>
</html>
