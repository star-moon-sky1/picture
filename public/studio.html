<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 后台页面基础信息。版本号用于确认 Cloudflare 是否部署了最新文件。 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="xingyueji-version" content="1.8.8.0">
  <title>星月集 · Studio</title>
  <style>
    /* =========================================================
       01. 后台全局颜色和基础控件
       ---------------------------------------------------------
       想修改整个后台的主色时，调整 :root 内的 --blue、--cyan。
       ========================================================= */
    * { box-sizing: border-box; }
    :root { --ink:#1d3037; --muted:#6e7d83; --line:#dfe7e8; --blue:#217fba; --cyan:#31bfc8; --soft:#eef7f7; --paper:#fff; --danger:#bd4f45; }
    html,body { margin:0; min-height:100%; font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:#f4f7f6; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }

    /* =========================================================
       02. 登录页面
       ---------------------------------------------------------
       登录密码不是写在 HTML 中，而是 Cloudflare Secret：
       ADMIN_PASSWORD。
       ========================================================= */
    .login-shell { min-height:100dvh; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 15% 10%,rgba(49,191,200,.18),transparent 35%),#f4f7f6; }
    .login-card { width:min(430px,100%); padding:38px; border-radius:22px; background:white; box-shadow:0 24px 70px rgba(30,60,70,.13); }
    .login-card h1 { margin:0 0 8px; font:500 2.3rem Georgia,"Songti SC",serif; }
    .login-card p { color:var(--muted); line-height:1.7; }
    .field { display:grid; gap:7px; margin-bottom:15px; }
    .field label { font-size:.8rem; color:var(--muted); font-weight:700; }
    input,textarea,select { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:white; color:var(--ink); outline:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(49,191,200,.12); }
    textarea { min-height:110px; resize:vertical; }
    .btn { border:0; border-radius:10px; padding:10px 14px; color:white; background:var(--blue); display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    .btn:hover { filter:brightness(.96); }
    .btn.secondary { color:var(--ink); background:var(--soft); }
    .btn.ghost { color:var(--ink); background:white; border:1px solid var(--line); }
    .btn.danger { background:var(--danger); }
    .btn.small { padding:7px 10px; font-size:.8rem; }
    .notice { min-height:20px; color:var(--danger); font-size:.82rem; margin-top:10px; }

    /* =========================================================
       03. 登录后的后台整体布局和左侧导航
       ---------------------------------------------------------
       电脑端左栏宽度由 grid-template-columns 的 220px 控制。
       ========================================================= */
    .studio { min-height:100dvh; display:grid; grid-template-columns:220px 1fr; }
    .side { position:sticky; top:0; height:100dvh; padding:25px 16px; background:#172d35; color:white; display:flex; flex-direction:column; overflow-y:auto; }
    .side h1 { margin:0 10px 5px; font:500 1.45rem Georgia,"Songti SC",serif; }
    .side small { margin:0 10px 24px; color:#a9c0c6; }
    .side-nav { display:grid; gap:6px; }
    .side-nav button { border:0; border-radius:10px; padding:10px 12px; text-align:left; color:#bcd0d4; background:transparent; }
    .side-nav button:hover { background:rgba(255,255,255,.08); color:white; }
    .side-nav button.active { background:linear-gradient(135deg,var(--blue),var(--cyan)); color:white; }
    .side-footer { margin-top:auto; display:grid; gap:8px; }
    .side-footer a { color:#bcd0d4; text-decoration:none; padding:8px 10px; font-size:.84rem; }

    /* =========================================================
       04. 右侧工作区、统计卡片和通用面板
       ---------------------------------------------------------
       .workspace 使用 overflow-y:auto，保证内容可纵向滚动。
       ========================================================= */
    .workspace { min-width:0; height:100dvh; overflow-y:auto; padding:34px clamp(18px,5vw,60px) 80px; }
    .topbar { display:flex; justify-content:space-between; gap:15px; align-items:center; margin-bottom:28px; }
    .topbar h2 { margin:0; font:500 clamp(1.8rem,4vw,2.8rem) Georgia,"Songti SC",serif; }
    .topbar p { margin:5px 0 0; color:var(--muted); }
    .view { display:none; }
    .view.active { display:block; }
    .cards { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
    .stat { padding:20px; background:white; border:1px solid var(--line); border-radius:15px; }
    .stat span { color:var(--muted); font-size:.76rem; }
    .stat strong { display:block; margin-top:9px; font-size:1.7rem; }
    .panel { margin-top:18px; padding:22px; background:white; border:1px solid var(--line); border-radius:16px; }
    .panel h3 { margin:0 0 17px; }
    .split { display:grid; grid-template-columns:minmax(260px,.72fr) minmax(0,1.5fr); gap:16px; }
    .list { display:grid; gap:8px; }
    .list-item { padding:13px; border:1px solid var(--line); border-radius:11px; background:white; }
    .list-item.active { border-color:var(--cyan); background:var(--soft); }
    .list-title { font-weight:700; }
    .list-meta { margin-top:6px; color:var(--muted); font-size:.76rem; }
    .list-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
    .form-grid .wide { grid-column:1/-1; }

    /* =========================================================
       05. 富文本文章编辑器
       ---------------------------------------------------------
       .toolbar 是格式按钮；.editor 是可直接输入正文的区域。
       编辑器最小高度可通过 min-height 修改。
       ========================================================= */
    .toolbar { display:flex; flex-wrap:wrap; gap:5px; padding:8px; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; background:#f7faf9; }
    .toolbar button { min-width:34px; border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:white; }
    .editor { min-height:360px; padding:18px; border:1px solid var(--line); border-radius:0 0 10px 10px; line-height:1.9; outline:none; overflow-wrap:anywhere; }
    .editor:focus { border-color:var(--cyan); }
    .editor img { max-width:100%; height:auto; border-radius:9px; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:16px; }
    .status { color:var(--muted); font-size:.82rem; }

    /* =========================================================
       06. 图片、相册和评论管理
       ---------------------------------------------------------
       .media-grid 的 repeat(4,...) 表示电脑端一行四张图片。
       ========================================================= */
    .media-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:11px; margin-top:18px; }
    .media-card { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:white; }
    .media-card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#e9eeee; }
    .media-info { padding:10px; }
    .media-info strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.83rem; }
    .media-info small { color:var(--muted); }
    .album-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .comment-row { padding:15px 0; border-top:1px solid var(--line); }
    .comment-row:first-child { border-top:0; }
    .comment-row p { margin:8px 0; white-space:pre-wrap; }
    .comment-row small { color:var(--muted); }

    /* =========================================================
       07. 平板与手机适配
       ---------------------------------------------------------
       980px 以下减少图片列数；720px 以下把左栏改为顶部导航。
       ========================================================= */
    @media(max-width:980px) { .cards{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr} .media-grid{grid-template-columns:repeat(3,1fr)} }
    @media(max-width:720px) {
      .studio { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:100dvh; }
      .side { position:static; height:auto; padding:12px; overflow:visible; }
      .side h1,.side small,.side-footer { display:none; }
      .side-nav { display:flex; overflow-x:auto; gap:5px; }
      .side-nav button { flex:0 0 auto; padding:8px 10px; }
      .workspace { height:auto; min-height:0; padding:22px 14px 55px; }
      .topbar { align-items:flex-start; }
      .cards,.form-grid { grid-template-columns:1fr; }
      .form-grid .wide { grid-column:auto; }
      .media-grid { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>
  <!-- ==================== 后台登录界面 ==================== -->
  <section id="login-shell" class="login-shell">
    <form id="login-form" class="login-card">
      <h1>星月集 Studio</h1>
      <p>像公众号一样撰写文章、发布旅行指南、管理图片与评论。</p>
      <div class="field"><label for="password">后台密码</label><input id="password" type="password" required autocomplete="current-password" placeholder="输入 ADMIN_PASSWORD"></div>
      <button class="btn" type="submit" style="width:100%">登录后台</button>
      <div id="login-notice" class="notice"></div>
    </form>
  </section>

  <!-- 登录成功后显示的完整后台。hidden 类会由 JavaScript 移除。 -->
  <div id="studio" class="studio hidden">
    <!-- 后台左侧/手机顶部导航。data-view 对应右侧 view-xxx。 -->
    <aside class="side">
      <h1>星月集 Studio</h1><small>内容发布与管理</small>
      <nav class="side-nav">
        <button class="active" data-view="dashboard">概览</button>
        <button data-view="content">文章与指南</button>
        <button data-view="changelogs">更新日志</button>
        <button data-view="media">图片与相册</button>
        <button data-view="comments">评论管理</button>
        <button data-view="settings">网站设置</button>
      </nav>
      <div class="side-footer"><a href="/" target="_blank">打开网站 ↗</a><button id="logout" class="btn small danger">退出登录</button></div>
    </aside>

    <!-- 后台右侧工作区域。 -->
    <main class="workspace">
      <header class="topbar">
        <div><h2 id="view-title">概览</h2><p id="view-desc">查看网站目前的内容状态。</p></div>
        <a class="btn ghost" href="/" target="_blank">预览网站</a>
      </header>

      <!-- ==================== 后台概览 ==================== -->
      <section id="view-dashboard" class="view active">
        <div id="stats" class="cards"></div>
        <div class="panel"><h3>开始发布</h3><p style="color:var(--muted);line-height:1.8">在“文章与指南”中新建内容，编辑完成后把状态改为“已发布”；更新日志采用追加方式保存，历史版本不会被覆盖。</p></div>
      </section>

      <!-- ==================== 文章与旅行指南编辑器 ==================== -->
      <section id="view-content" class="view">
        <div class="split">
          <div class="panel" style="margin-top:0">
            <div class="actions" style="margin:0 0 14px"><button id="new-content" class="btn small">新建内容</button><button id="refresh-content" class="btn small ghost">刷新</button></div>
            <div id="content-list" class="list"></div>
          </div>
          <form id="content-form" class="panel" style="margin-top:0">
            <input id="content-id" type="hidden">
            <div class="form-grid">
              <div class="field"><label>专栏</label><select id="content-type"><option value="article">文章</option><option value="guide">北京旅行指南</option></select></div>
              <div class="field"><label>状态</label><select id="content-status"><option value="draft">草稿</option><option value="published">已发布</option></select></div>
              <div class="field wide"><label>标题</label><input id="content-title" maxlength="120" required placeholder="输入标题"></div>
              <div class="field wide"><label>摘要</label><textarea id="content-excerpt" maxlength="500" style="min-height:75px" placeholder="列表中显示的简短介绍"></textarea></div>
              <div class="field wide"><label>封面图片</label><select id="content-cover"><option value="">无封面</option></select></div>
              <div class="wide">
                <!-- 正文工具栏：按钮使用 data-command 调用浏览器富文本命令。 -->
                <label style="display:block;margin-bottom:7px;color:var(--muted);font-size:.8rem;font-weight:700">正文</label>
                <div class="toolbar">
                  <button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button>
                  <button type="button" data-block="h2">H2</button><button type="button" data-block="h3">H3</button>
                  <button type="button" data-command="insertUnorderedList">列表</button><button type="button" id="insert-link">链接</button><button type="button" id="insert-image">插图</button>
                </div>
                <div id="content-editor" class="editor" contenteditable="true"></div>
                <input id="inline-image-input" class="hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
              </div>
            </div>
            <div class="actions"><button class="btn" type="submit">保存内容</button><button id="delete-content" class="btn danger hidden" type="button">删除</button><span id="content-notice" class="status"></span></div>
          </form>
        </div>
      </section>

      <!-- ==================== 历史更新日志 ==================== -->
      <section id="view-changelogs" class="view">
        <div class="split">
          <div class="panel" style="margin-top:0"><div id="changelog-list" class="list"></div></div>
          <form id="changelog-form" class="panel" style="margin-top:0">
            <h3>追加更新记录</h3><input id="changelog-id" type="hidden">
            <div class="form-grid">
              <div class="field"><label>版本号</label><input id="changelog-version" required maxlength="30" placeholder="例如 1.8.8.0"></div>
              <div class="field"><label>发布日期</label><input id="changelog-date" type="date"></div>
              <div class="field wide"><label>标题</label><input id="changelog-title" required maxlength="120"></div>
              <div class="field wide"><label>更新内容</label><textarea id="changelog-body" required maxlength="4000"></textarea></div>
            </div>
            <div class="actions"><button class="btn" type="submit">保存更新记录</button><button id="new-changelog" class="btn ghost" type="button">清空表单</button><button id="delete-changelog" class="btn danger hidden" type="button">删除</button><span id="changelog-notice" class="status"></span></div>
          </form>
        </div>
      </section>

      <!-- ==================== R2 图片与相册 ==================== -->
      <section id="view-media" class="view">
        <div class="panel" style="margin-top:0">
          <h3>相册板块</h3><div id="album-row" class="album-row"></div>
          <div class="actions"><button id="add-album" class="btn small">新建相册</button></div>
        </div>
        <form id="media-form" class="panel">
          <h3>上传图片</h3>
          <div class="form-grid">
            <div class="field"><label>图片文件（最大 20MB）</label><input id="media-file" type="file" required accept="image/jpeg,image/png,image/webp,image/gif,image/avif"></div>
            <div class="field"><label>所属相册</label><select id="media-album"></select></div>
            <div class="field wide"><label>图片说明</label><input id="media-caption" maxlength="500"></div>
          </div>
          <div class="actions"><button class="btn" type="submit">上传到图片专栏</button><span id="media-notice" class="status"></span></div>
        </form>
        <div id="media-grid" class="media-grid"></div>
      </section>

      <!-- ==================== 游客评论管理 ==================== -->
      <section id="view-comments" class="view"><div class="panel" style="margin-top:0"><div class="actions" style="margin:0 0 10px"><button id="refresh-comments" class="btn small ghost">刷新评论</button></div><div id="comment-admin-list"></div></div></section>

      <!-- ==================== 网站公开资料设置 ==================== -->
      <section id="view-settings" class="view">
        <form id="settings-form" class="panel" style="margin-top:0;max-width:760px">
          <div class="form-grid">
            <div class="field"><label>网站名称</label><input id="setting-site-title" maxlength="80"></div>
            <div class="field"><label>网站主人</label><input id="setting-owner-name" maxlength="80"></div>
            <div class="field wide"><label>就读院校</label><input id="setting-school" maxlength="160"></div>
            <div class="field wide"><label>主页介绍</label><textarea id="setting-intro" maxlength="1000"></textarea></div>
            <div class="field wide"><label>联系邮箱</label><input id="setting-email" type="email" maxlength="240"></div>
          </div>
          <div class="actions"><button class="btn" type="submit">保存网站设置</button><span id="settings-notice" class="status"></span></div>
        </form>
      </section>
    </main>
  </div>

  <!-- 后台 JavaScript：登录验证、读取数据、保存内容和上传图片。 -->
  <script>
    const app = { content: [], changelogs: [], albums: [], media: [], comments: [], settings: {} };
    const viewInfo = {
      dashboard:["概览","查看网站目前的内容状态。"], content:["文章与指南","撰写、保存草稿并发布文章或北京旅行指南。"],
      changelogs:["更新日志","追加并保留每一次网站版本更新。"], media:["图片与相册","上传原图、划分主题相册并管理下载资源。"],
      comments:["评论管理","查看、隐藏或删除游客评论。"], settings:["网站设置","修改主页显示的公开资料。"],
    };

    async function api(path, options={}) {
      const response = await fetch(path, options); const type=response.headers.get("content-type")||"";
      const data=type.includes("application/json")?await response.json():null;
      if(!response.ok) throw new Error(data?.error||`请求失败（${response.status}）`); return data;
    }
    function formatDate(value){return value?new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(value)):""}
    function clear(node){node.replaceChildren()}
    function button(text,className="btn small ghost"){const b=document.createElement("button");b.type="button";b.className=className;b.textContent=text;return b}

    async function checkSession(){try{await api("/api/admin/session");showStudio();await loadAll()}catch{document.getElementById("login-shell").classList.remove("hidden")}}
    function showStudio(){document.getElementById("login-shell").classList.add("hidden");document.getElementById("studio").classList.remove("hidden")}

    function switchView(name){
      document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===`view-${name}`));
      document.querySelectorAll(".side-nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));
      document.getElementById("view-title").textContent=viewInfo[name][0];document.getElementById("view-desc").textContent=viewInfo[name][1];
    }

    async function loadAll(){await Promise.all([loadDashboard(),loadContent(),loadChangelogs(),loadAlbumsAndMedia(),loadComments(),loadSettings()])}
    async function loadDashboard(){const data=await api("/api/admin/dashboard");const stats=document.getElementById("stats");clear(stats);[["全部内容",data.content],["已发布",data.published],["评论",data.comments],["图片",data.media],["更新记录",data.changelogs]].forEach(([label,value])=>{const card=document.createElement("div");card.className="stat";const s=document.createElement("span");s.textContent=label;const strong=document.createElement("strong");strong.textContent=value;card.append(s,strong);stats.append(card)})}

    async function loadContent(){app.content=await api("/api/admin/content");renderContentList();refreshCoverOptions()}
    function renderContentList(){const list=document.getElementById("content-list");clear(list);if(!app.content.length){const p=document.createElement("p");p.className="status";p.textContent="还没有内容。";list.append(p);return}app.content.forEach(item=>{const row=document.createElement("div");row.className=`list-item${document.getElementById("content-id").value===item.id?" active":""}`;const title=document.createElement("div");title.className="list-title";title.textContent=item.title;const meta=document.createElement("div");meta.className="list-meta";meta.textContent=`${item.type==="guide"?"北京旅行指南":"文章"} · ${item.status==="published"?"已发布":"草稿"} · ${formatDate(item.updated_at)}`;row.append(title,meta);row.addEventListener("click",()=>editContent(item));list.append(row)})}
    function resetContentForm(){document.getElementById("content-form").reset();document.getElementById("content-id").value="";document.getElementById("content-editor").innerHTML="<p></p>";document.getElementById("delete-content").classList.add("hidden");document.getElementById("content-notice").textContent="";renderContentList()}
    function editContent(item){document.getElementById("content-id").value=item.id;document.getElementById("content-type").value=item.type;document.getElementById("content-status").value=item.status;document.getElementById("content-title").value=item.title;document.getElementById("content-excerpt").value=item.excerpt||"";document.getElementById("content-cover").value=item.cover_media_id||"";document.getElementById("content-editor").innerHTML=item.body_html||"<p></p>";document.getElementById("delete-content").classList.remove("hidden");renderContentList()}
    function contentPayload(){return{type:document.getElementById("content-type").value,status:document.getElementById("content-status").value,title:document.getElementById("content-title").value,excerpt:document.getElementById("content-excerpt").value,coverMediaId:document.getElementById("content-cover").value,bodyHtml:document.getElementById("content-editor").innerHTML}}

    async function loadChangelogs(){app.changelogs=await api("/api/admin/changelogs");renderChangelogs()}
    function renderChangelogs(){const list=document.getElementById("changelog-list");clear(list);app.changelogs.forEach(item=>{const row=document.createElement("div");row.className="list-item";const title=document.createElement("div");title.className="list-title";title.textContent=`v${item.version} · ${item.title}`;const meta=document.createElement("div");meta.className="list-meta";meta.textContent=formatDate(item.published_at);row.append(title,meta);row.addEventListener("click",()=>editChangelog(item));list.append(row)})}
    function resetChangelog(){document.getElementById("changelog-form").reset();document.getElementById("changelog-id").value="";document.getElementById("changelog-date").value=new Date().toISOString().slice(0,10);document.getElementById("delete-changelog").classList.add("hidden");document.getElementById("changelog-notice").textContent=""}
    function editChangelog(item){document.getElementById("changelog-id").value=item.id;document.getElementById("changelog-version").value=item.version;document.getElementById("changelog-title").value=item.title;document.getElementById("changelog-body").value=item.body;document.getElementById("changelog-date").value=new Date(item.published_at).toISOString().slice(0,10);document.getElementById("delete-changelog").classList.remove("hidden")}

    async function loadAlbumsAndMedia(){[app.albums,app.media]=await Promise.all([api("/api/admin/albums"),api("/api/admin/media")]);renderAlbums();renderMedia();refreshCoverOptions()}
    function renderAlbums(){const row=document.getElementById("album-row");const select=document.getElementById("media-album");clear(row);clear(select);const none=document.createElement("option");none.value="";none.textContent="未分类";select.append(none);app.albums.forEach(album=>{const chip=button(`${album.name}（${album.media_count||0}）`);chip.addEventListener("click",()=>editAlbum(album));row.append(chip);const option=document.createElement("option");option.value=album.id;option.textContent=album.name;select.append(option)})}
    function renderMedia(){const grid=document.getElementById("media-grid");clear(grid);app.media.forEach(item=>{const card=document.createElement("article");card.className="media-card";const img=document.createElement("img");img.loading="lazy";img.src=item.url;img.alt=item.caption||item.filename;const info=document.createElement("div");info.className="media-info";const title=document.createElement("strong");title.textContent=item.caption||item.filename;const small=document.createElement("small");small.textContent=item.album_name|| (item.kind==="inline"?"文章插图":"未分类");const actions=document.createElement("div");actions.className="list-actions";const copy=button("复制地址");copy.addEventListener("click",async()=>{await navigator.clipboard.writeText(new URL(item.url,location.origin).href);copy.textContent="已复制"});const del=button("删除","btn small danger");del.addEventListener("click",()=>deleteMedia(item));actions.append(copy,del);info.append(title,small,actions);card.append(img,info);grid.append(card)})}
    function refreshCoverOptions(){const select=document.getElementById("content-cover");if(!select)return;const current=select.value;clear(select);const none=document.createElement("option");none.value="";none.textContent="无封面";select.append(none);app.media.forEach(item=>{const option=document.createElement("option");option.value=item.id;option.textContent=item.caption||item.filename;select.append(option)});select.value=current}

    async function loadComments(){app.comments=await api("/api/admin/comments");renderAdminComments()}
    function renderAdminComments(){const list=document.getElementById("comment-admin-list");clear(list);if(!app.comments.length){const p=document.createElement("p");p.className="status";p.textContent="暂无评论。";list.append(p);return}app.comments.forEach(item=>{const row=document.createElement("article");row.className="comment-row";const head=document.createElement("strong");head.textContent=`${item.guest_name} · ${item.content_title||"内容已删除"}`;const meta=document.createElement("small");meta.textContent=`${formatDate(item.created_at)} · ${item.status==="hidden"?"已隐藏":"公开"}`;const body=document.createElement("p");body.textContent=item.body;const actions=document.createElement("div");actions.className="list-actions";const toggle=button(item.status==="hidden"?"恢复显示":"隐藏");toggle.addEventListener("click",()=>toggleComment(item));const del=button("删除","btn small danger");del.addEventListener("click",()=>deleteComment(item));actions.append(toggle,del);row.append(head,document.createElement("br"),meta,body,actions);list.append(row)})}

    async function loadSettings(){app.settings=await api("/api/admin/settings");document.getElementById("setting-site-title").value=app.settings.site_title||"";document.getElementById("setting-owner-name").value=app.settings.owner_name||"";document.getElementById("setting-school").value=app.settings.school||"";document.getElementById("setting-intro").value=app.settings.intro||"";document.getElementById("setting-email").value=app.settings.contact_email||""}

    async function uploadInline(file){const form=new FormData();form.append("file",file);form.append("kind","inline");const item=await api("/api/admin/media",{method:"POST",body:form});app.media.unshift(item);refreshCoverOptions();return item}
    async function deleteMedia(item){if(!confirm(`确定删除“${item.filename}”吗？原图将同时删除。`))return;await api(`/api/admin/media/${item.id}`,{method:"DELETE"});await loadAlbumsAndMedia();await loadDashboard()}
    async function editAlbum(album){const name=prompt("相册名称",album.name);if(name===null)return;const description=prompt("相册说明",album.description||"");if(description===null)return;await api(`/api/admin/albums/${album.id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,description,sortOrder:album.sort_order})});await loadAlbumsAndMedia()}
    async function toggleComment(item){await api(`/api/admin/comments/${item.id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:item.status==="hidden"?"active":"hidden"})});await loadComments()}
    async function deleteComment(item){if(!confirm("确定删除这条评论及其回复吗？"))return;await api(`/api/admin/comments/${item.id}`,{method:"DELETE"});await loadComments();await loadDashboard()}

    document.getElementById("login-form").addEventListener("submit",async event=>{event.preventDefault();const notice=document.getElementById("login-notice");notice.textContent="正在登录…";try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});showStudio();await loadAll()}catch(error){notice.textContent=error.message}});
    document.querySelectorAll(".side-nav button").forEach(b=>b.addEventListener("click",()=>switchView(b.dataset.view)));
    document.getElementById("logout").addEventListener("click",async()=>{await api("/api/admin/logout",{method:"POST"});location.reload()});
    document.getElementById("new-content").addEventListener("click",resetContentForm);document.getElementById("refresh-content").addEventListener("click",loadContent);
    document.getElementById("content-form").addEventListener("submit",async event=>{event.preventDefault();const id=document.getElementById("content-id").value;const notice=document.getElementById("content-notice");notice.textContent="正在保存…";try{await api(id?`/api/admin/content/${id}`:"/api/admin/content",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(contentPayload())});notice.textContent="已保存。";await loadContent();await loadDashboard();if(!id)resetContentForm()}catch(error){notice.textContent=error.message}});
    document.getElementById("delete-content").addEventListener("click",async()=>{const id=document.getElementById("content-id").value;if(!id||!confirm("确定删除这篇内容及其全部评论吗？"))return;await api(`/api/admin/content/${id}`,{method:"DELETE"});resetContentForm();await loadContent();await loadComments();await loadDashboard()});
    document.querySelectorAll("[data-command]").forEach(b=>b.addEventListener("click",()=>document.execCommand(b.dataset.command,false,null)));document.querySelectorAll("[data-block]").forEach(b=>b.addEventListener("click",()=>document.execCommand("formatBlock",false,b.dataset.block)));
    document.getElementById("insert-link").addEventListener("click",()=>{const url=prompt("链接地址（需要以 https:// 开头）");if(url)document.execCommand("createLink",false,url)});document.getElementById("insert-image").addEventListener("click",()=>document.getElementById("inline-image-input").click());
    document.getElementById("inline-image-input").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;const notice=document.getElementById("content-notice");notice.textContent="正在上传插图…";try{const item=await uploadInline(file);document.getElementById("content-editor").focus();document.execCommand("insertImage",false,item.url);notice.textContent="插图已插入正文。"}catch(error){notice.textContent=error.message}event.target.value=""});

    document.getElementById("changelog-form").addEventListener("submit",async event=>{event.preventDefault();const id=document.getElementById("changelog-id").value;const notice=document.getElementById("changelog-notice");const date=document.getElementById("changelog-date").value;try{await api(id?`/api/admin/changelogs/${id}`:"/api/admin/changelogs",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version:document.getElementById("changelog-version").value,title:document.getElementById("changelog-title").value,body:document.getElementById("changelog-body").value,publishedAt:date?`${date}T12:00:00.000Z`:new Date().toISOString()})});notice.textContent="更新记录已保存。";resetChangelog();await loadChangelogs();await loadDashboard()}catch(error){notice.textContent=error.message}});
    document.getElementById("new-changelog").addEventListener("click",resetChangelog);document.getElementById("delete-changelog").addEventListener("click",async()=>{const id=document.getElementById("changelog-id").value;if(!id||!confirm("确定删除这条更新记录吗？"))return;await api(`/api/admin/changelogs/${id}`,{method:"DELETE"});resetChangelog();await loadChangelogs();await loadDashboard()});

    document.getElementById("add-album").addEventListener("click",async()=>{const name=prompt("新相册名称");if(!name)return;const description=prompt("相册说明")||"";await api("/api/admin/albums",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,description})});await loadAlbumsAndMedia()});
    document.getElementById("media-form").addEventListener("submit",async event=>{event.preventDefault();const file=document.getElementById("media-file").files[0];const notice=document.getElementById("media-notice");if(!file)return;const form=new FormData();form.append("file",file);form.append("albumId",document.getElementById("media-album").value);form.append("caption",document.getElementById("media-caption").value);form.append("kind","photo");notice.textContent="正在上传原图…";try{await api("/api/admin/media",{method:"POST",body:form});event.currentTarget.reset();notice.textContent="图片上传成功。";await loadAlbumsAndMedia();await loadDashboard()}catch(error){notice.textContent=error.message}});
    document.getElementById("refresh-comments").addEventListener("click",loadComments);
    document.getElementById("settings-form").addEventListener("submit",async event=>{event.preventDefault();const notice=document.getElementById("settings-notice");try{app.settings=await api("/api/admin/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({site_title:document.getElementById("setting-site-title").value,owner_name:document.getElementById("setting-owner-name").value,school:document.getElementById("setting-school").value,intro:document.getElementById("setting-intro").value,contact_email:document.getElementById("setting-email").value})});notice.textContent="网站设置已保存。"}catch(error){notice.textContent=error.message}});

    resetContentForm();resetChangelog();checkSession();
  </script>
</body>
</html>
