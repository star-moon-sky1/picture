<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星月集 - 个人主页</title>
  <link rel="icon" href="https://xingyueji-1-1413014837.cos.ap-beijing.myqcloud.com/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20260311220605_94_88.jpg" type="image/webp">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* 原有样式保留 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #faf8f4;
      --sage: #73dbeb;
      --sage-light: #217fba;
      --sage-dark: #31cdcd;
      --sand: #e8e0d0;
      --charcoal: #2a2a2a;
      --warm-gray: #8a8278;
      --accent: #c4735a;
      --accent-light: #ead6ce;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
      width: 240px;
      min-width: 240px;
      padding: 2.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--cream);
      border-right: 1px solid var(--sand);
    }

    .avatar-wrap {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sage-light), var(--sage-dark));
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem; border: 3px solid var(--cream);
      box-shadow: 0 0 0 2px var(--sage-light); overflow: hidden;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .sidebar-name { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--charcoal); line-height: 1.2; margin-bottom: .5rem; }
    .sidebar-name-en { display: block; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 300; color: var(--warm-gray); margin-top: 2px; }
    .sidebar-motto { font-size: .8rem; color: var(--warm-gray); line-height: 1.6; font-style: italic; font-weight: 300; margin-bottom: 1.6rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--sand); }

    .sidebar-nav { list-style: none; width: 100%; margin-bottom: auto; }
    .sidebar-nav li { margin-bottom: .2rem; }
    .sidebar-nav a {
      display: block; padding: .5rem .7rem; text-decoration: none;
      color: var(--warm-gray); font-size: .83rem; border-radius: 6px; transition: all .18s; cursor: pointer;
    }
    .sidebar-nav a:hover { background: var(--sand); color: var(--charcoal); }
    .sidebar-nav a.active { background: var(--sage-dark); color: #fff; }

    /* ========== 内容区控制 ========== */
    .main { flex: 1; padding: 3rem 3.5rem; max-width: 760px; }
    .content-section { display: none; } /* 默认隐藏所有板块 */
    .content-section.active { display: block; animation: fadeIn 0.5s ease; } /* 显示激活板块 */

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 样式补充 */
    .main h1 { font-family: 'DM Serif Display', serif; font-size: 2.2rem; margin-bottom: .3rem; }
    .slogan { font-size: .85rem; letter-spacing: .2em; color: var(--sage-dark); text-transform: uppercase; margin-bottom: 1.8rem; }
    .divider { border: none; border-top: 1px solid var(--sand); margin: 1.8rem 0; }
    .contact-info { display: flex; flex-direction: column; gap: .9rem; }
    .contact-info p { display: flex; gap: 1rem; align-items: flex-start; font-size: .9rem; }
    .school-tag { background: var(--accent-light); color: var(--accent); font-size: .78rem; padding: 3px 10px; border-radius: 20px; }
    .badge-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
    .badge { background: var(--sand); color: var(--charcoal); font-size: .78rem; padding: 5px 14px; border-radius: 20px; }
    .script-wrapper { border: 1px solid var(--sage-dark); border-radius: 8px; padding: .7rem 1.2rem; display: inline-block; }
    .script-title-link { text-decoration: none; color: var(--sage-dark); font-size: .88rem; line-height: 1.7; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="avatar-wrap">
      <img src="https://xingyueji-1-1413014837.cos.ap-beijing.myqcloud.com/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20260311220605_94_88.jpg" alt="星月集" />
    </div>
    <div class="sidebar-name">星月集<span class="sidebar-name-en">xingyueji</span></div>
    <div class="sidebar-motto"> </div>
    <ul class="sidebar-nav">
      <li><a onclick="showSection('home')" id="nav-home" class="active">主页</a></li>
      <li><a onclick="showSection('about')" id="nav-about">关于我</a></li>
      <li><a onclick="showSection('portfolio')" id="nav-portfolio">作品集</a></li>
      <li><a onclick="showSection('contact')" id="nav-contact">联系方式</a></li>
    </ul>
  </div>

  <div class="main">
    
    <section id="home" class="content-section active">
      <h1>星月集</h1>
      <p class="slogan">XING YUE JI</p>
      <div class="intro-text">
        <p>这里是星月集的个人主页。</p>
        <p style="color: var(--warm-gray); font-size: .85rem; margin-top: .4rem;">此网站将不断更新新的内容，欢迎持续关注！</p>
      </div>
    </section>

    <section id="about" class="content-section">
      <h1>关于我</h1>
      <div class="divider"><hr></div>
      <div class="contact-info">
        <p><span><strong>🏫 院校</strong></span> <span class="school-tag">北京理工大学 · 睿信书院</span></p>
      </div>
      <div class="divider"><hr></div>
      <h3 style="font-family: 'DM Serif Display'; font-weight: 400;">正在学习的语言</h3>
      <div class="badge-container">
        <span class="badge">Python</span>
        <span class="badge">C Language</span>
        <span class="badge">HTML / CSS</span>
      </div>
    </section>

    <section id="portfolio" class="content-section">
      <h1>作品集</h1>
      <div class="divider"><hr></div>
      <div class="script-wrapper">
        <a href="/Lugoubridge-screenplay.html" class="script-title-link">
          卢沟桥微电影剧本<br>Bridge: From Lugou to the Peace
        </a>
      </div>
    </section>

    <section id="contact" class="content-section">
      <h1>联系方式</h1>
      <div class="divider"><hr></div>
      <div class="contact-info">
        <p><span><strong>📧 邮箱</strong></span> <span>1598116329@qq.com (国内)<br>xingyueji8@gmail.com (国际)</span></p>
      </div>
    </section>

  </div>

  <script>
    function showSection(sectionId) {
      // 1. 隐藏所有内容板块
      const sections = document.querySelectorAll('.content-section');
      sections.forEach(sec => sec.classList.remove('active'));

      // 2. 取消所有导航栏高亮
      const navLinks = document.querySelectorAll('.sidebar-nav a');
      navLinks.forEach(link => link.classList.remove('active'));

      // 3. 显示指定的板块
      document.getElementById(sectionId).classList.add('active');

      // 4. 高亮当前点击的导航
      document.getElementById('nav-' + sectionId).classList.add('active');
    }
  </script>

</body>
</html>
